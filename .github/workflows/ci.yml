name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  # Placeholder public values so `next build` and module imports succeed in CI.
  # They are not secrets and point at no real project.
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  web:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests with coverage (thresholds in vitest.config.mts)
        run: npm run test:coverage

      - name: Build
        run: npm run build

  deno:
    name: Edge functions (deno check + deno test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The repo's package.json would make Deno expect a node_modules folder; edge functions use URL imports only.
      DENO_NO_PACKAGE_JSON: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Cache Deno dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock', 'supabase/functions/**/*.ts') }}
          restore-keys: deno-${{ runner.os }}-

      - name: Type-check every edge function entrypoint
        run: deno check supabase/functions/*/index.ts

      - name: Type-check evals and run the offline retrieval baseline
        shell: bash
        run: |
          deno check evals/**/*.ts
          # The hash baseline is expected to miss the Recall@6 gate; this step only proves the harness runs.
          deno run -A evals/retrieval/run.ts --embedder hash || true

      - name: Run Deno tests (*_test.ts only)
        shell: bash
        run: |
          # *.test.ts files under supabase/functions/_shared are Vitest suites
          # (run by `npm test`); only *_test.ts files are Deno tests.
          mapfile -t files < <(find supabase/functions -name '*_test.ts' | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Deno test files found; skipping."
            exit 0
          fi
          deno test --allow-env --allow-net --allow-read "${files[@]}"

  database:
    name: Database (pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check for pgTAP tests
        id: guard
        shell: bash
        run: |
          if [ -d supabase/tests ] && [ -n "$(find supabase/tests -name '*.sql' -print -quit)" ]; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            echo "No pgTAP tests in supabase/tests; skipping database job."
          fi

      - uses: supabase/setup-cli@v1
        if: steps.guard.outputs.has_tests == 'true'
        with:
          version: latest

      - name: Start local database (applies migrations)
        if: steps.guard.outputs.has_tests == 'true'
        run: supabase db start

      - name: Run pgTAP tests
        if: steps.guard.outputs.has_tests == 'true'
        run: supabase test db

      - name: Print database logs on failure
        if: failure() && steps.guard.outputs.has_tests == 'true'
        run: docker ps -a --format '{{.Names}}' | grep -E 'supabase_db' | xargs -r -I{} docker logs --tail 200 {}

      - name: Stop local database
        if: always() && steps.guard.outputs.has_tests == 'true'
        run: supabase stop --no-backup

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run e2e tests
        # playwright.config.ts starts `npm run start` (production build above) when CI is set.
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            next-start.log
          retention-days: 7
